<header><div class="wrap" id="head"></div></header>
<main class="wrap" id="app"></main>
<footer>hosting28 · by <a href="https://dvaosem.com" target="_blank" rel="noopener">dvaosem</a></footer>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
// Parser for the dvaosem audit-hostingu.php text output -> plain JSON snapshot.
// Pure function, no DOM. The Slovak section names below are what the PHP script prints.
function parseAudit(text) {
  const out = {
    v: 1, ts: '', root: '', phpVersion: '', server: '', disk: '', files: 0, dirs: 0, total: '',
    counts: { high: 0, medium: 0, low: 0, info: 0 },
    findings: { high: [], medium: [], low: [], info: [] },
    ini: {}, cache: '', htaccess: '', php: [], dupes: [], missing: [], groups: [], recent: [], recentTruncated: false, rootList: []
  };
  const LV = { 'VYSOKÉ': 'high', 'STREDNÉ': 'medium', 'NÍZKE': 'low', 'INFO': 'info' };
  const FLAGS = {
    'zapisuje/maže': 'writes', 'číta vstup': 'input', 'volá sieť': 'network', 'CORS *': 'cors',
    'SPÚŠŤA PRÍKAZY': 'exec', 'INCLUDE Z VSTUPU': 'include', 'má overenie': 'auth',
    'bez viditeľného overenia': 'noauth', 'kontroluje len pôvod (Origin/Referer)': 'origin'
  };
  const SIZE = '([\\d.]+ (?:B|kB|MB))';
  const reRecent = new RegExp('^(\\d{4}-\\d\\d-\\d\\d \\d\\d:\\d\\d)\\s+' + SIZE + '\\s+(.+)$');
  const reDir = /^\[DIR\]\s+(\S.*?)\s+zmena (\d{4}-\d\d-\d\d \d\d:\d\d)\s+práva (\d{4})$/;
  const reFile = new RegExp('^\\s{7}(\\S.*?)\\s+' + SIZE + '\\s+zmena (\\d{4}-\\d\\d-\\d\\d \\d\\d:\\d\\d)\\s+práva (\\d{4})$');
  const rePhp = new RegExp('^(\\S+)\\s+' + SIZE + '\\s+(.+)$');

  let sec = '', lvl = '', curMissing = null, curGroup = null;
  const ht = [];
  for (const raw of text.replace(/\r/g, '').split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const head = /^=== (.+?) ===$/.exec(line);
    if (head) {
      const n = head[1];
      sec = n.startsWith('SÚHRN') ? 'sum' : n.startsWith('PROSTREDIE') ? 'env' : n.startsWith('.HTACCESS') ? 'ht'
        : n.startsWith('PHP SKRIPTY') ? 'php' : n.startsWith('DUPLICITNÉ') ? 'dup' : n.startsWith('ODKAZY') ? 'miss'
        : n.startsWith('SKUPINY') ? 'grp' : n.startsWith('ZMENENÉ') ? 'rec' : n.startsWith('OBSAH ROOTU') ? 'root' : '';
      continue;
    }
    if (line.startsWith('--- koniec')) break;
    if (!line) { if (sec === 'ht') ht.push(''); continue; }

    if (sec === 'sum') {
      let m = /^(VYSOKÉ|STREDNÉ|NÍZKE|INFO): (\d+)$/.exec(line);
      if (m) { out.counts[LV[m[1]]] = +m[2]; continue; }
      m = /^--- (VYSOKÉ|STREDNÉ|NÍZKE|INFO) ---$/.exec(line);
      if (m) { lvl = LV[m[1]]; continue; }
      if (lvl && line.startsWith('• ')) out.findings[lvl].push(line.slice(2));
    } else if (sec === 'env') {
      parseEnvLine(line, out);
    } else if (sec === 'ht') {
      ht.push(line);
    } else if (sec === 'php') {
      const m = rePhp.exec(line);
      if (m) out.php.push({ name: m[1], size: m[2], flags: m[3].split(', ').map(f => FLAGS[f] || f) });
    } else if (sec === 'dup') {
      if (line.includes('  =  ')) out.dupes.push(line.split('  =  '));
    } else if (sec === 'miss') {
      const m = /^\s+chýba: (.+)$/.exec(raw);
      if (m && curMissing) curMissing.refs.push(m[1]);
      else if (/^\S.*:$/.test(line)) { curMissing = { src: line.slice(0, -1), refs: [] }; out.missing.push(curMissing); }
    } else if (sec === 'grp') {
      const m = /^(\d{4}-\d\d-\d\d \d\d:\d\d)\s+\((\d+) súborov\)$/.exec(line);
      if (m) { curGroup = { t: m[1], n: +m[2], sample: [] }; out.groups.push(curGroup); }
      else if (curGroup && /^\s{4}\S/.test(raw) && !line.trim().startsWith('...')) curGroup.sample.push(line.trim());
    } else if (sec === 'rec') {
      const m = reRecent.exec(line);
      if (m) out.recent.push({ t: m[1], size: m[2], path: m[3] });
      else if (line.includes('skrátené')) out.recentTruncated = true;
    } else if (sec === 'root') {
      let m = reDir.exec(raw);
      if (m) { out.rootList.push({ name: m[1], dir: true, size: '', mod: m[2], perm: m[3] }); continue; }
      m = reFile.exec(raw);

// ---------- compare ----------
const diffSets = (a, b) => ({ added: b.filter(x => !a.includes(x)), removed: a.filter(x => !b.includes(x)) });
function diffSnap(base, now) {
  const fOf = s => LVL.flatMap(l => s.findings[l].map(m => l + '|' + m));
  const f = diffSets(fOf(base), fOf(now));
  const pk = p => p.name + '|' + p.size + '|' + p.flags.join(',');
  const p = diffSets(base.php.map(pk), now.php.map(pk));
  const rk = r => r.name + '|' + r.size + '|' + r.mod;
  const nameOf = k => k.split('|')[0];
  const r = diffSets(base.rootList.map(rk), now.rootList.map(rk));
  const baseNames = base.rootList.map(x => x.name), nowNames = now.rootList.map(x => x.name);
  return {
    newF: f.added.map(x => x.split('|').slice(1).join('|')), goneF: f.removed.map(x => x.split('|').slice(1).join('|')),
    newP: p.added.map(nameOf), goneP: p.removed.map(nameOf).filter(n => !now.php.some(x => x.name === n)),
    newR: r.added.map(nameOf).filter(n => !baseNames.includes(n)), goneR: r.removed.map(nameOf).filter(n => !nowNames.includes(n)),
    chgR: r.added.map(nameOf).filter(n => baseNames.includes(n))

}

// ---------- quick request widget (text + voice) -> queue ----------
const W = { kind: 'task', open: false, rec: null, on: false, app: '', text: '', base: '', sig: '' };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function wStop() { if (W.rec) { try { W.rec.stop(); } catch (e) { /* already stopped */ } } W.on = false; }
function wMic() {
  if (window.H28Native) { W.on = false; try { window.H28Native.startDictation(S.lang === 'sk' ? 'sk-SK' : 'en-US'); } catch (e) { toast(t('wNoMic'), 'warn'); } return; }
  if (!SR) { toast(t('wNoMic'), 'warn'); return; }

  const r = new SR();
  r.lang = S.lang === 'sk' ? 'sk-SK' : 'en-US'; r.continuous = true; r.interimResults = true;
  W.base = W.text ? W.text.replace(/\s+$/, '') + ' ' : '';

  r.onend = () => { W.on = false; wPaint(true); };
  r.onerror = e => { W.on = false; toast(t(e.error === 'not-allowed' ? 'wDenied' : 'wNoMic'), 'warn'); wPaint(true); };
  W.rec = r; W.on = true;
  try { r.start(); } catch (e) { W.on = false; }
  wPaint(true);
}
async function wSend() {
  const text = W.text.trim();

  const title = (W.app ? W.app + ': ' : '') + text.slice(0, 70) + (text.length > 70 ? '…' : '');
  if (await qCall({ action: 'add', title, body: text, kind: W.kind })) { toast(t(W.kind === 'note' ? 'wSentNote' : 'wSent'), 'ok'); W.text = ''; W.open = false; wPaint(true); }
}
function wPaint(force) {
  let root = document.getElementById('w-root');
  if (!root) { root = h('div', { id: 'w-root' }); document.body.appendChild(root); }
  const names = (M.apps || []).map(a => a.key);
  const editing = S.tab === 'notes' && N.open;
  const sig = [!!window.DVAOSEM_USER, W.open, W.on, W.kind, S.lang, names.length, editing].join('|');
  if (!force && sig === W.sig) return;
  W.sig = sig;
  if (!window.DVAOSEM_USER) { fill(root); return; }
  if (!W.open) {
    if (editing) { fill(root); return; }
    const open = (kind, mic) => () => { W.kind = kind; W.open = true; W.pendingMic = !!mic; wPaint(true); if (!mic) setTimeout(() => { const ta = document.getElementById('w-text'); if (ta) ta.focus(); }, 50); };
    const dk = (ic, key, extra) => h('button', Object.assign({ class: 'dk', 'aria-label': t(key) }, extra), icon(ic), h('span', null, t(key)));
    fill(root, h('nav', { class: 'dock', 'aria-label': t('wFab') },
      dk('pen', 'bTask', { class: 'dk pri', onclick: open('task') }), dk('note', 'bNote', { onclick: open('note') }), dk('mic', 'bVoice', { onclick: open(S.tab === 'notes' ? 'note' : 'task', true) }),
      h('a', { class: 'dk', href: 'https://claude.ai/new?q=fronta', target: '_blank', rel: 'noopener', 'aria-label': t('bChat') }, icon('chat'), h('span', null, t('bChat')))));
    return;
  }
  const sorted = names.filter(n => n !== 'Hosting28').sort((a, b) => a.localeCompare(b, 'sk', { sensitivity: 'base' }));
  const allApps = ['Hosting28'].concat(sorted);
  const cmbInp = h('input', { type: 'search', class: 'cmb-in', placeholder: t('wApp'), 'aria-label': t('wApp'), autocomplete: 'off', value: W.app || '' });
  const cmbList = h('div', { class: 'cmb-list' });

    const s = q.trim().toLowerCase(), m = allApps.filter(n => !s || n.toLowerCase().includes(s));
    cmbList.textContent = '';
    m.forEach(n => cmbList.appendChild(h('button', { type: 'button', class: 'cmb-i' + (n === W.app ? ' on' : ''), onmousedown: e => e.preventDefault(), onclick: () => { W.app = n; cmbInp.value = n; cmbList.style.display = 'none'; cmbInp.blur(); } }, n)));
    if (!m.length) cmbList.appendChild(h('div', { class: 'cmb-n' }, '—'));
    cmbList.style.display = 'block';
  };
  cmbInp.addEventListener('focus', () => { cmbInp.select(); cmbFill(''); });
  cmbInp.addEventListener('input', () => { W.app = ''; cmbFill(cmbInp.value); });

// Android APK shell: native dictation result, and widget / shortcut deep links (#new, #note, #voice).
window.h28Dictated = txt => {
