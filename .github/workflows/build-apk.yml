name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'web/**'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notes28-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Every build becomes a release "build-N"; the app checks the latest one for updates.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk notes28.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" notes28.apk \
            --title "N28 build ${GITHUB_RUN_NUMBER}" \
            --notes "${NOTES:-Manual build}" \
            --latest
